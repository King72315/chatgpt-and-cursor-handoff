name: Handoff gateway

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: recover or seed
        required: true
        default: recover
        type: choice
        options:
          - recover
          - seed
      issue_number:
        description: Issue number for a simulated assignment
        required: false
        type: string
      project_repository:
        description: Repository named by a simulated assignment
        required: false
        type: string
      scope:
        description: Approved scope for a simulated assignment
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: handoff-gateway
  cancel-in-progress: false

jobs:
  gateway:
    if: ${{ github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GATEWAY_POST: "1"
      INPUT_MODE: ${{ github.event.inputs.mode }}
      INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
      INPUT_PROJECT_REPOSITORY: ${{ github.event.inputs.project_repository }}
      INPUT_SCOPE: ${{ github.event.inputs.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test gateway
        run: node --test gateway/test/protocol.test.mjs
      - name: Apply gateway events
        run: node gateway/run.mjs
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            git add gateway/ledger.json
            if git diff --cached --quiet; then
              echo "No ledger change"
              return 0
            fi
            git commit -m "Record handoff gateway state."
            if git pull --rebase origin master && git push; then
              return 0
            fi
            return 1
          }
          if ! publish; then
            git rebase --abort || true
            git fetch origin master
            git reset --hard origin/master
            node gateway/run.mjs
            publish
          fi
